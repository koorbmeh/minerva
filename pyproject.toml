[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minerva-agent"
version = "0.1.0"
description = "A personal AI agent runtime with a governed tool gateway, a tamper-evident audit ledger and multi-agent job orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesse Hembrook" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
